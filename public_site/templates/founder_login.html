
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Founder Login | LabPilot AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #17233b;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 36px;
            background: white;
            border: 1px solid #e0e7f0;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(20, 50, 90, 0.08);
        }

        .brand {
            color: #163b75;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #65748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 9px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd7e5;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #163b75;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #102c58;
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fff0f0;
            color: #a12626;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #7b8798;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">LabPilot AI</div>

        <h1>Founder Login</h1>

        <p class="subtitle">
            Private access to customer feedback,
            validation records and research insights.
        </p>

        {% if error %}
        <div class="error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <label for="password">Founder Password</label>
            <input
               type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}"
            >

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Sign In
            </button>
        </form>

        <div class="footer">
            Restricted Access · LabPilot AI
        </div>
    </main>
</body>
</html>
