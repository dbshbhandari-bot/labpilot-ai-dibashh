
{% extends "base.html" %}

{% block content %}

<h1>Edit AST Measurement</h1>

<p>
    Update an existing antibiotic
    susceptibility measurement.
</p>

<div class="experiment-planner-card">

    <h2>Edit Antibiotic Result</h2>

    <form
        action="/experiments/ast/measurements/{{ measurement[0] }}/update"
        method="POST"
    >

        <label for="antibiotic">
            Antibiotic Name
        </label>

        <input
            type="text"
            id="antibiotic"
            name="antibiotic"
            value="{{ measurement[2] }}"
            required
        >

        <label for="zone_diameter">
            Inhibition Zone Diameter (mm)
        </label>

        <input
            type="number"
            id="zone_diameter"
            name="zone_diameter"
            value="{{ measurement[3] }}"
            min="0"
            step="0.1"
            required
        >

          <label for="replicate_number">
          Replicate Number
         </label>

         <input
          type="number"
          id="replicate_number"
          name="replicate_number"
          min="1"
         step="1"
         value="{{ measurement[6] }}"
         required
         >


       <div style="margin-top: 18px; margin-bottom: 18px;">


        <label for="disk_strength">
       Antibiotic Disk Strength (µg)
       </label>

        <input
        type="number"
        id="disk_strength"
       name="disk_strength"
       min="0"
       step="any"
       value="{{ (measurement[5] or '') | replace('µg', '') | trim }}"
       placeholder="e.g. 5"
       required
       style="
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        "
         >

        </div>


        <label for="notes">
            Laboratory Notes
        </label>

        <textarea
            id="notes"
            name="notes"
            rows="4"
        >{{ measurement[4] or "" }}</textarea>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <p>
        <a href="/experiments/ast/{{ measurement[1] }}">
            Cancel and return to experiment
        </a>
    </p>

</div>

{% endblock %}
