
{% extends "base.html" %}

{% block content %}

<h1>Antibiotic Susceptibility Testing</h1>

<p>
    Record disk-diffusion measurements for
    laboratory research using LabPilot AI.
</p>

<div class="experiment-planner-card">

    <h2>New AST Experiment</h2>

    <form
    id="astForm"
    action="/experiments/ast/save"
    method="POST"
>

        <label for="experimentTitle">
            Experiment Title
        </label>
        <input
            type="text"
            id="experimentTitle"
            name="experiment_title"
            required
        >

        <label for="organism">
            Bacterial Organism
        </label>
        <input
            type="text"
            id="organism"
            name="organism"
            placeholder="e.g. Escherichia coli"
            required
        >

        <label for="sampleName">
            Sample Identifier
        </label>
        <input
            type="text"
            id="sampleName"
            name="sample_name"
            required
        >

        <label for="antibiotic">
            Antibiotic Name
        </label>
        <input
            type="text"
            id="antibiotic"
            name="antibiotic"
            placeholder="e.g. Ciprofloxacin"
            required
        >

        <label for="zoneDiameter">
            Inhibition Zone Diameter (mm)
        </label>
        <input
            type="number"
            id="zoneDiameter"
            name="zone_diameter"
            min="0"
            step="0.1"
            required
        >

        <label for="notes">
            Laboratory Notes
        </label>
        <textarea
            id="notes"
            name="notes"
            rows="4"
        ></textarea>

        <button type="submit">
            Record Measurement
        </button>

    </form>


</div>



{% endblock %}
